# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master", "release", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      # Remove the runner.temp definitions from here

    steps:
    - uses: actions/checkout@v3

    # New step to set your temp environment variables dynamically
    - name: Initialize Temp Directories
      run: |
        echo "TMPDIR=$RUNNER_TEMP" >> $GITHUB_ENV
        echo "TMP=$RUNNER_TEMP" >> $GITHUB_ENV
        echo "TEMP=$RUNNER_TEMP" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build Project
      run: dotnet build --no-restore -c Release /p:EnableWindowsTargeting=true
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
